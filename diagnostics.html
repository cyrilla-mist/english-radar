<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Radar Storage Diagnostics</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #18231f; color: #f3f5ed; }
    body { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-family: Georgia, serif; font-weight: 500; }
    p { color: #cad1c7; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; background: #1f2c27; }
    th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.12); text-align: left; }
    th { color: #cedcc7; font-size: 13px; }
    td { font-variant-numeric: tabular-nums; }
    .note { color: #9eb09b; }
    code { color: #f5f2e8; }
  </style>
</head>
<body>
  <main>
    <p class="note">DEVELOPMENT ONLY · This page reports metadata, not learning content.</p>
    <h1>Storage diagnostics</h1>
    <p>Only key existence, size, parse time and aggregate counts are shown. Tokens, expressions, examples and signal bodies are never rendered.</p>
    <div id="summary" aria-live="polite"></div>
    <table>
      <thead><tr><th>Key</th><th>Exists</th><th>Chars</th><th>UTF-8 bytes</th><th>JSON.parse ms</th><th>Entries</th><th>Extra counts</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="performance" class="note"></p>
  </main>
  <script src="./js/performance-diagnostics.js"></script>
</body>
</html>

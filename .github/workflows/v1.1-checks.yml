name: English Radar v1.1 checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate content data
        run: node scripts/validate-data.js

      - name: Check project structure
        run: node scripts/check-project.js

      - name: Test v1.1 learning engine
        run: node tests/learning-engine-v1.1.test.js
